name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit check
        run: npm run check:unit

      - name: Pack and package smoke
        run: |
          npm pack
          bash scripts/ci-package-smoke.sh

  compat:
    name: Compat (Node 22.14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.14"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: CLI smoke
        run: |
          node dist/index.js __ci_smoke_invalid__ 2>&1 | grep -q "Unknown mode"
